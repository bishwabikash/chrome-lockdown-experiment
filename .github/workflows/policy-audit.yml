name: Chrome policy audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "lockdown.json"
      - "no-extensions.json"
      - "audit/**"
      - ".github/workflows/policy-audit.yml"

permissions:
  contents: read
  issues: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.v.outputs.stable }}
      beta: ${{ steps.v.outputs.beta }}
      dev: ${{ steps.v.outputs.dev }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          api=https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels
          for ch in stable beta dev; do
            ver=$(curl -fsS "$api/$ch/versions/all/releases?filter=endtime=none&order_by=starttime%20desc" \
                  | jq -r '.releases[0].version')
            [[ -n "$ver" && "$ver" != "null" ]] || { echo "could not resolve $ch" >&2; exit 1; }
            echo "$ch=$ver" >> "$GITHUB_OUTPUT"
            echo "linux $ch -> $ver"
          done

  audit:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            version: ${{ needs.resolve.outputs.stable }}
            blocking: true
          - channel: beta
            version: ${{ needs.resolve.outputs.beta }}
            blocking: false
          - channel: dev
            version: ${{ needs.resolve.outputs.dev }}
            blocking: false
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet pyyaml

      - name: Fetch policy definitions at ${{ matrix.version }}
        run: ./audit/fetch-policy-defs.sh "${{ matrix.version }}" /tmp/defs

      - name: Audit
        id: audit
        run: |
          set -o pipefail
          milestone="${{ matrix.version }}"
          milestone="${milestone%%.*}"
          python3 -I audit/audit_policies.py \
            /tmp/defs/components/policy/resources/templates/policy_definitions \
            lockdown.json "$milestone" | tee /tmp/report.txt
        continue-on-error: ${{ !matrix.blocking }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.channel }} — Chrome ${{ matrix.version }}"
            echo '```'
            grep -vE '  OK ' /tmp/report.txt || cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ matrix.version }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.txt', 'utf8');
            const failing = report.split('\n').filter(l => l && !l.includes('  OK '));
            const title = `Policy audit failing on ${process.env.CHANNEL} (Chrome ${process.env.VERSION})`;
            const body = [
              `Audited \`lockdown.json\` against Chromium tag \`${process.env.VERSION}\`.`,
              '',
              '```',
              failing.join('\n'),
              '```',
              '',
              `[Run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'policy-audit',
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['policy-audit', process.env.CHANNEL],
              });
            }

  stamp:
    needs: [resolve, audit]
    if: success() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Record successful audit
        run: |
          set -euo pipefail
          printf 'last clean audit: %s against Chrome %s (linux stable)\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ needs.resolve.outputs.stable }}" > .audit-stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit-stamp
          git diff --quiet --cached && { echo "no change"; exit 0; }
          git commit -m "ci: clean policy audit against Chrome ${{ needs.resolve.outputs.stable }}"
          git push
